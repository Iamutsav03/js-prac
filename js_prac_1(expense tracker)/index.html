<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="expenseForm" onsubmit="addExpense(event)">
        <label for="expenseAmount">Choose Expense Amount:</label>
        <input type="number" id="expenseAmount" placeholder="Enter amount">
        
        <label for="expenseCategory">Choose Expense Category:</label>
        <select id="expenseCategory">
            <option value="food">Food</option>
            <option value="transportation">Transportation</option>
            <option value="entertainment">Entertainment</option>
            <option value="utilities">Utilities</option>
            <option value="other">Other</option>
        </select>

        <label for="expenseDescription">Choose Expense Description:</label>
        <input type="text" id="expenseDescription" placeholder="Enter description">

        <button type="submit">Add Expense</button>

        <ul id="expense-list"></ul>
    </form>
    
    <script src="script.js"></script>
</body>
</html>
